<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>SEO Autopilot — Dashboard</title>
<style>
  :root{
    --bg:#f6f5f2; --panel:#fff; --ink:#1c1b19; --muted:#6b6862; --line:#e6e3dc;
    --accent:#1f5f4a; --accent-soft:#e3efe9; --high:#b4362b; --med:#b7791f; --low:#6b6862;
    --good:#1f7a4d; --bad:#b4362b;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.5 -apple-system,"Segoe UI",Inter,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
  header{display:flex;align-items:baseline;gap:16px;padding:22px 32px 14px;border-bottom:1px solid var(--line);background:var(--panel)}
  header h1{font-size:18px;margin:0;letter-spacing:-.01em}
  header .meta{color:var(--muted);font-size:12.5px}
  main{padding:24px 32px 60px;max-width:1400px;margin:0 auto}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:22px}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
  .kpi .l{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
  .kpi .v{font-size:24px;font-weight:650;margin-top:4px;font-variant-numeric:tabular-nums}
  .kpi .d{font-size:12px;margin-left:6px;font-weight:500}
  .up{color:var(--good)} .down{color:var(--bad)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  table{width:100%;border-collapse:collapse}
  th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
  th{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:600;background:#fbfaf8;position:sticky;top:0}
  td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
  tr.click{cursor:pointer} tr.click:hover td{background:#faf9f6}
  tr:last-child td{border-bottom:none}
  .name{font-weight:600} .sub{color:var(--muted);font-size:12px}
  .pill{display:inline-block;padding:1px 8px;border-radius:99px;font-size:11.5px;font-weight:600;border:1px solid var(--line);white-space:nowrap}
  .pill.high{color:var(--high);border-color:#efc9c4;background:#fbefed}
  .pill.medium{color:var(--med);border-color:#efdcb8;background:#fcf5e8}
  .pill.low{color:var(--low)}
  .pill.ok{color:var(--good);border-color:#c5e2d2;background:#eef7f1}
  .pill.off{color:var(--muted)}
  .health{display:inline-flex;align-items:center;gap:8px}
  .bar{width:60px;height:6px;border-radius:3px;background:#ece9e2;overflow:hidden}
  .bar i{display:block;height:100%}
  a{color:var(--accent)}
  #detail{display:none}
  .back{background:none;border:none;color:var(--accent);cursor:pointer;font:inherit;padding:0;margin-bottom:12px}
  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:18px 0 0}
  .tab{padding:9px 14px;border:none;background:none;font:inherit;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
  .tab.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
  .pane{padding-top:16px}
  h2{font-size:20px;margin:0}
  h3{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:22px 0 8px}
  .empty{padding:26px;color:var(--muted);text-align:center}
  .err{background:#fbefed;border:1px solid #efc9c4;color:var(--high);padding:10px 14px;border-radius:8px;margin-top:12px;font-size:13px}
  .chart{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
  code{font-family:var(--mono);font-size:12px;background:#f1efea;padding:1px 5px;border-radius:4px}
  .url{max-width:420px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
  .filter{display:flex;gap:8px;margin-bottom:10px}
  .filter button{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:3px 12px;font:inherit;font-size:12.5px;cursor:pointer}
  .filter button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
</style>
</head>
<body>
<header>
  <h1>SEO Autopilot</h1>
  <span class="meta" id="gen"></span>
</header>
<main>
  <section id="overview">
    <div class="kpis" id="kpis"></div>
    <div class="card"><table id="sites"></table></div>
    <h3>Recent writing runs</h3>
    <div class="card"><table id="runs"></table></div>
  </section>
  <section id="detail"></section>
</main>
<script>
window.EMBED = null;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = n => n == null ? "—" : Math.round(n).toLocaleString();
const when = s => s ? new Date(s).toLocaleString(undefined,{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}) : "—";
function delta(cur, prev){
  if(cur == null || !prev) return "";
  const p = (cur - prev) / prev * 100;
  return ` <span class="d ${p >= 0 ? "up" : "down"}">${p >= 0 ? "▲" : "▼"} ${Math.abs(p).toFixed(0)}%</span>`;
}
function health(h){
  if(h == null) return '<span class="sub">not crawled</span>';
  const c = h >= 80 ? "var(--good)" : h >= 55 ? "var(--med)" : "var(--high)";
  return `<span class="health"><span class="bar"><i style="width:${h}%;background:${c}"></i></span><b>${h}</b></span>`;
}
let DATA;

async function load(){
  DATA = window.EMBED || await fetch("data/all.json", {cache:"no-store"}).then(r => r.json());
  $("#gen").textContent = "Updated " + when(DATA.generated_at);
  if(DATA.paused) document.querySelector("main").insertAdjacentHTML("afterbegin",
    '<div class="err" style="margin:0 0 16px"><b>Autopilot paused</b> — repo variable AUTOPILOT_PAUSED is on, no blogs are being written.</div>');
  renderOverview();
  let k = ""; try { k = decodeURIComponent(location.hash.slice(1)); } catch(e) {}
  if(k && DATA.details[k]) openSite(k);
}

function renderOverview(){
  const S = DATA.sites;
  const sum = k => S.reduce((a, s) => a + (s[k] || 0), 0);
  const hs = S.filter(s => s.health != null);
  const avgH = hs.length ? Math.round(hs.reduce((a, s) => a + s.health, 0) / hs.length) : null;
  const high = S.reduce((a, s) => a + (s.issue_counts?.high || 0), 0);
  $("#kpis").innerHTML = [
    ["Sites", S.filter(s => s.enabled).length + ` <span class="d sub">/ ${S.length}</span>`],
    ["Clicks · 28d", num(sum("clicks")) + delta(sum("clicks"), sum("clicks_prev"))],
    ["Impressions · 28d", num(sum("impressions")) + delta(sum("impressions"), sum("impressions_prev"))],
    ["Avg. health", avgH ?? "—"],
    ["High-priority issues", high],
    ["Articles written", sum("articles_total")],
    ["Drafts to review", sum("needs_review")],
    ["Indexed by Google", sum("index_checked") ? `${sum("indexed")} <span class="d sub">/ ${sum("index_checked")}</span>` : "—"],
  ].map(([l, v]) => `<div class="kpi"><div class="l">${l}</div><div class="v">${v}</div></div>`).join("");

  $("#sites").innerHTML = `<tr><th>Site</th><th>Health</th><th class="n">Clicks 28d</th><th class="n">Impr. 28d</th>
    <th>Issues</th><th class="n">Rank Math</th><th>Builder</th><th>Cadence</th><th>Next post</th><th>Status</th></tr>` +
    S.map(s => {
      const st = s.status || {};
      const errs = Object.entries(st).filter(([k, v]) => k.endsWith("_error") && v);
      const ic = s.issue_counts || {};
      return `<tr class="click" onclick="openSite('${esc(s.key)}')">
        <td><div class="name">${esc(s.name)}</div><div class="sub">${esc(s.url.replace(/^https?:\/\//, ""))}</div></td>
        <td>${health(s.health)}</td>
        <td class="n">${num(s.clicks)}${delta(s.clicks, s.clicks_prev)}</td>
        <td class="n">${num(s.impressions)}</td>
        <td>${ic.high ? `<span class="pill high">${ic.high} high</span> ` : ""}${ic.medium ? `<span class="pill medium">${ic.medium} med</span>` : ""}${!ic.high && !ic.medium && s.health != null ? '<span class="pill ok">clean</span>' : ""}</td>
        <td class="n">${s.avg_rankmath != null ? s.avg_rankmath + "%" : "—"}${s.needs_review ? ` <span class="pill medium" title="drafts waiting for review">${s.needs_review} review</span>` : ""}</td>
        <td><span class="pill">${esc(s.builder || "auto")}</span></td>
        <td>${s.enabled ? `<span class="pill">every ${s.interval_days}d · ${esc(s.publish_mode)}</span>` : '<span class="pill off">disabled</span>'}</td>
        <td>${when(s.next_scheduled)}</td>
        <td>${!s.enabled ? '<span class="pill off">—</span>' : st.paused_reason ? `<span class="pill high" title="${esc(st.paused_reason)}">paused</span>` : errs.length ? `<span class="pill high" title="${esc(errs.map(e => e[0] + ": " + e[1]).join("\n"))}">${errs.length} error</span>` : '<span class="pill ok">ok</span>'}</td>
      </tr>`;
    }).join("");

  const R = (DATA.runs || []).slice().reverse();
  $("#runs").innerHTML = R.length ? `<tr><th>When</th><th class="n">Articles</th><th class="n">Web searches</th><th class="n">Est. cost</th><th>Errors</th></tr>` +
    R.map(r => `<tr><td>${when(r.at)}</td><td class="n">${r.articles}</td><td class="n">${r.usage?.searches ?? 0}</td>
      <td class="n">$${(r.est_cost_usd ?? 0).toFixed(2)}</td>
      <td>${Object.keys(r.errors || {}).map(k => `<span class="pill high" title="${esc(r.errors[k])}">${esc(k)}</span>`).join(" ") || '<span class="sub">none</span>'}</td></tr>`).join("")
    : `<tr><td class="empty">No writing runs yet.</td></tr>`;
}

function spark(daily){
  if(!daily || !daily.length) return '<div class="empty">No Search Console data yet — see README → Search Console setup.</div>';
  const W = 900, H = 160, P = 28, max = Math.max(...daily.map(d => d.clicks), 1);
  const x = i => P + i * (W - 2 * P) / Math.max(daily.length - 1, 1);
  const y = v => H - P - v / max * (H - 2 * P);
  const pts = daily.map((d, i) => `${x(i).toFixed(1)},${y(d.clicks).toFixed(1)}`).join(" ");
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Daily clicks">
    <line x1="${P}" x2="${W - P}" y1="${H - P}" y2="${H - P}" stroke="var(--line)"/>
    <polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2"/>
    <text x="${P}" y="${H - 8}" font-size="11" fill="var(--muted)">${esc(daily[0].date)}</text>
    <text x="${W - P}" y="${H - 8}" font-size="11" fill="var(--muted)" text-anchor="end">${esc(daily.at(-1).date)}</text>
    <text x="${P}" y="${P - 10}" font-size="11" fill="var(--muted)">max ${max} clicks/day</text></svg>`;
}

const table = (head, rows, empty) => rows.length
  ? `<div class="card"><table><tr>${head.map(h => `<th${h.startsWith("#") ? ' class="n"' : ""}>${esc(h.replace("#", ""))}</th>`).join("")}</tr>${rows.join("")}</table></div>`
  : `<div class="card"><div class="empty">${empty}</div></div>`;

function openSite(key){
  const d = DATA.details[key];
  try { location.hash = key; } catch(e) {}
  $("#overview").style.display = "none";
  const el = $("#detail"); el.style.display = "block";
  const st = d.status || {};
  const errs = Object.entries(st).filter(([k, v]) => k.endsWith("_error") && v);
  const g = d.gsc || {};
  el.innerHTML = `<button class="back" onclick="closeSite()">← All sites</button>
    <h2>${esc(d.name)}</h2><div class="sub"><a href="${esc(d.url)}" target="_blank" rel="noopener">${esc(d.url)}</a> · last crawl ${when(d.crawled_at)}</div>
    ${st.paused_reason ? `<div class="err"><b>Writing paused:</b> ${esc(st.paused_reason)}</div>` : ""}
    ${errs.map(([k, v]) => `<div class="err"><b>${esc(k.replace("_error", ""))}:</b> ${esc(v)}</div>`).join("")}
    <div class="sub" style="margin-top:6px">Builder: <b>${esc(d.builder)}</b> · one blog every <b>${d.interval_days}</b> days · mode <b>${esc(d.publish_mode)}</b>${d.group ? ` · niche group <b>${esc(d.group)}</b>` : ""}${st.next_due ? ` · ${esc(st.next_due)}` : ""}</div>
    <div class="kpis" style="margin-top:16px">
      <div class="kpi"><div class="l">Health</div><div class="v">${d.health ?? "—"}</div></div>
      <div class="kpi"><div class="l">Clicks · 28d</div><div class="v">${num(g.clicks)}${delta(g.clicks, g.clicks_prev)}</div></div>
      <div class="kpi"><div class="l">Impressions · 28d</div><div class="v">${num(g.impressions)}${delta(g.impressions, g.impressions_prev)}</div></div>
      <div class="kpi"><div class="l">Pages / posts</div><div class="v">${d.pages} <span class="d sub">/ ${d.posts}</span></div></div>
    </div>
    <div class="tabs">${["Articles", "Issues", "Search", "Opportunities", "Links"].map((t, i) => `<button class="tab${i ? "" : " on"}" data-t="${t}">${t}</button>`).join("")}</div>
    <div class="pane" id="pane"></div>`;
  el.querySelectorAll(".tab").forEach(b => b.onclick = () => {
    el.querySelectorAll(".tab").forEach(x => x.classList.toggle("on", x === b)); renderPane(d, b.dataset.t);
  });
  renderPane(d, "Articles");
  window.scrollTo(0, 0);
}
function closeSite(){ try { history.replaceState(null, "", location.pathname + location.search); } catch(e) { try { location.hash = ""; } catch(_) {} } $("#detail").style.display = "none"; $("#overview").style.display = "block"; }

function renderPane(d, t){
  const p = $("#pane");
  if(t === "Articles"){
    p.innerHTML = table(["Title", "Status", "Goes live", "#Words", "#Rank Math", "#AI-search", "#Quality", "Humanize", "Google index", "Review notes"], d.articles.map(a => {
      const h = a.humanize || {};
      const rm = a.rankmath_score;
      const notes = [...(a.review_reasons || []), ...((a.unsourced_claims || []).length ? [`${a.unsourced_claims.length} claim(s) to verify`] : [])];
      return `<tr><td><div class="name">${esc(a.title)}</div>
          <div class="sub">${esc(a.focus_keyword)}${a.builder ? " · " + esc(a.builder) : ""}</div>
          <div class="sub">${a.edit_url ? `<a href="${esc(a.edit_url)}" target="_blank" rel="noopener">Edit in WordPress</a>` : ""}${a.link ? ` · <a href="${esc(a.link)}" target="_blank" rel="noopener">Preview</a>` : ""}</div></td>
        <td><span class="pill ${a.status === "future" ? "ok" : a.status === "draft" ? "medium" : ""}">${esc(a.status === "future" ? "scheduled" : a.status)}</span></td>
        <td>${when(a.scheduled_for)}</td><td class="n">${num(a.word_count)}</td>
        <td class="n">${rm != null ? `<span class="pill ${rm >= 80 ? "ok" : "high"}" title="${esc((a.rankmath_failed || []).join("\n"))}">${rm}%</span>` : "—"}</td>
        <td class="n">${a.geo_score != null ? `<span class="pill ${a.geo_score >= 80 ? "ok" : "medium"}" title="${esc((a.geo_failed || []).join("\n"))}">${a.geo_score}%</span>` : "—"}</td>
        <td class="n">${a.quality ? `<span class="pill ${a.quality.overall >= 60 ? "ok" : "high"}" title="filler ${a.quality.filler_score} · AI patterns ${a.quality.ai_pattern_score} · repetition ${a.quality.repetition_score} · info density ${a.quality.information_density}${(a.quality.flags || []).length ? " · " + esc(a.quality.flags.join(", ")) : ""}">${a.quality.overall}</span>` : "—"}</td>
        <td>${h.flesch != null ? `<span class="pill ${a.humanize_ok ? "ok" : "medium"}" title="Flesch ${h.flesch} · sentence variation ${h.sentence_variation} · passive ${h.passive_pct}%${(h.ai_phrases_left || []).length ? " · AI phrases: " + esc(h.ai_phrases_left.join(", ")) : ""}">Flesch ${Math.round(h.flesch)}</span>` : "—"}</td>
        <td>${a.index ? `<span class="pill ${a.index.verdict === "PASS" ? "ok" : "medium"}" title="${esc(a.index.coverage || "")} · checked ${esc(a.index.checked_at || "")}">${a.index.verdict === "PASS" ? "indexed" : "not yet"}</span>` : '<span class="sub">—</span>'}</td>
        <td>${notes.length ? `<span class="sub" title="${esc((a.unsourced_claims || []).join("\n"))}">${esc(notes.join(" · "))}</span>` : '<span class="pill ok">passed</span>'}</td></tr>`;
    }), "No blogs written yet. They appear here after the first daily run.");
  } else if(t === "Issues"){
    let f = "all";
    const draw = () => {
      const rows = d.issues.filter(i => f === "all" || i.severity === f);
      p.innerHTML = `<div class="filter">${["all", "high", "medium", "low"].map(s => `<button class="${s === f ? "on" : ""}" data-f="${s}">${s}</button>`).join("")}</div>` +
        table(["Severity", "Issue", "Page"], rows.map(i => `<tr><td><span class="pill ${i.severity}">${i.severity}</span></td><td>${esc(i.message)}</td>
          <td><a class="url" href="${esc(i.url.startsWith("http") ? i.url : d.url + i.url)}" target="_blank" rel="noopener">${esc(i.url.replace(d.url, "") || "/")}</a></td></tr>`), "No issues found 🎉");
      p.querySelectorAll("[data-f]").forEach(b => b.onclick = () => { f = b.dataset.f; draw(); });
    };
    draw();
  } else if(t === "Search"){
    const g = d.gsc || {};
    const qrow = q => `<tr><td>${esc(q.query)}</td><td class="n">${num(q.clicks)}</td><td class="n">${num(q.impressions)}</td><td class="n">${q.position}</td>
      <td><a class="url" href="${esc(q.page)}" target="_blank" rel="noopener">${esc(q.page.replace(d.url, ""))}</a></td></tr>`;
    p.innerHTML = `<div class="chart">${spark(g.daily)}</div>
      <h3>Striking distance — positions 8–20, push these to page 1</h3>
      ${table(["Query", "#Clicks", "#Impr.", "#Pos.", "Ranking page"], (g.striking_distance || []).map(qrow), "None yet.")}
      <h3>Top queries</h3>
      ${table(["Query", "#Clicks", "#Impr.", "#Pos.", "Ranking page"], (g.top_queries || []).map(qrow), "No Search Console data.")}`;
  } else if(t === "Opportunities"){
    p.innerHTML = `<h3>Refresh existing pages</h3>
      ${table(["Query", "Page", "#Pos.", "#Impr.", "Action"], d.refresh.map(r => `<tr><td>${esc(r.keyword)}</td>
        <td><a class="url" href="${esc(r.page)}" target="_blank" rel="noopener">${esc(r.page.replace(d.url, ""))}</a></td>
        <td class="n">${r.position}</td><td class="n">${num(r.impressions)}</td><td>${esc(r.action)}</td></tr>`), "Nothing to refresh right now.")}
      <h3>Competitor content gaps — topics competitors cover that you don't</h3>
      ${table(["Topic (from competitor URL)", "Competitor"], (d.competitor_gaps || []).map(g => `<tr><td><a href="${esc(g.url)}" target="_blank" rel="noopener">${esc(g.keyword)}</a></td><td>${esc(g.competitor)}</td></tr>`), "Add competitors to sites.yaml — gaps appear after the Monday audit.")}
      <h3>Next topic candidates</h3>
      ${table(["Keyword", "Source", "#Score"], d.candidates.map(c => `<tr><td>${esc(c.keyword)}</td>
        <td><span class="pill">${({search_console:"Search Console", autocomplete:"Autocomplete", competitor_gap:"Competitor gap"})[c.source] || esc(c.source)}</span></td><td class="n">${Math.round(c.score)}</td></tr>`), "Run research to fill this.")}`;
  } else if(t === "Links"){
    p.innerHTML = `<h3>Internal links to add</h3>
      ${table(["Add a link on", "Pointing to", "Suggested anchor"], d.internal_links.map(l => `<tr>
        <td><a class="url" href="${esc(l.from)}" target="_blank" rel="noopener">${esc(l.from_title || l.from)}</a></td>
        <td><a class="url" href="${esc(l.to)}" target="_blank" rel="noopener">${esc(l.to.replace(d.url, ""))}</a></td><td>${esc(l.anchor)}</td></tr>`), "No suggestions.")}
      <h3>Backlink prospecting — open, review sites, then pitch manually</h3>
      ${table(["Type", "Google search"], d.prospecting.map(q => `<tr><td>${esc(q.type)}</td>
        <td><a href="${esc(q.google_url)}" target="_blank" rel="noopener"><code>${esc(q.query)}</code></a></td></tr>`), "Add seed_keywords to sites.yaml.")}`;
  }
}
load().catch(e => { document.querySelector("main").innerHTML = `<div class="err">Could not load dashboard data: ${esc(e.message)}. Run the workflow once, or open data/dashboard.html.</div>`; });
</script>
</body>
</html>
