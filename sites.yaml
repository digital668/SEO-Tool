# ─────────────────────────────────────────────────────────────
#  SEO Autopilot — site list
#  One block per WordPress site. Keys are NOT stored here:
#  each site's Connector-plugin key goes in a GitHub Secret named
#  WP_PASS_<KEY>  (key upper-cased, dashes → underscores)
#  e.g. key "nexgen-internet"  →  secret  WP_PASS_NEXGEN_INTERNET
# ─────────────────────────────────────────────────────────────

defaults:
  language: English
  country: US                # search market for research (US, IN, GB …)
  interval_days: 2           # ONE new blog every 2 days per site (= 5 per 10-day cycle, repeating)
  review_days: 3             # scheduled posts go live this many days after writing (your review window)
  min_words: 1200
  builder: auto              # auto-detects Divi / Elementor / Gutenberg. Or set: divi | elementor | gutenberg
  use_web_research: true     # Claude checks what ranks on Google before writing (~$0.01 per search)
  images: true               # free Pexels / Openverse photo, uploaded with keyword alt text
  toc_plugin: false          # true if Easy TOC / LuckyWP / Rank Math TOC block adds a table of contents itself
  publish_mode: schedule     # schedule | draft | off
  ymyl: false                # true for money / credit / health / legal sites → ALWAYS draft, a person approves
  pause_on_traffic_drop: 0.35  # stop writing for a site if its weekly clicks drop 35%+ (0 = never pause)
  author_id: null            # WordPress user ID shown as author (use a real person with a bio)
  default_category: Blog

sites:
  # ── US internet sites: same niche → same "group", so they never get the same topic
  - key: nexgen-internet
    name: NexGen Internet Pro
    url: https://www.nexgeninternetpro.com
    wp_user: admin
    gsc_property: sc-domain:nexgeninternetpro.com   # or "https://www.example.com/" for URL-prefix properties
    group: us-internet
    niche: Home internet providers, broadband plans and internet availability in the USA
    audience: US households comparing or switching internet providers
    tone: Helpful, plain-English, comparison-driven
    seed_keywords: [internet providers near me, cheap internet plans, fiber internet]
    competitors: [broadbandnow.com, highspeedinternet.com]
    enabled: false           # switch on when its WP_PASS_NEXGEN_INTERNET secret is added

  # - key: broadband-saver
  #   name: Broadband Saver
  #   url: https://www.example-broadbandsaver.com
  #   wp_user: admin
  #   gsc_property: sc-domain:example-broadbandsaver.com
  #   group: us-internet
  #   builder: divi
  #   niche: Saving money on home internet and broadband bills in the USA
  #   seed_keywords: [lower internet bill, internet deals, low income internet]
  #   competitors: [allconnect.com]
  #   enabled: true

  # ── Money / health sites: ymyl → every post waits as a draft for a person to approve
  # - key: bettercreditpro
  #   name: Better Credit Pro
  #   url: https://bettercreditpro.com
  #   wp_user: admin
  #   group: us-credit
  #   ymyl: true
  #   niche: Credit repair and credit score education in the USA
  #   seed_keywords: [how to raise credit score, credit repair]
  #   enabled: true

  # ── US IT / BPO brands: same niche → same "group", so they never get the same topic.
  #    Add Impeck LLC, Mergen Infotech and Versatile IT later with  group: us-it-bpo
  - key: globel-connect                      # → GitHub secret WP_PASS_GLOBEL_CONNECT
    name: Globel Connect
    url: https://globelconnect.in
    # gsc_property: sc-domain:globelconnect.in   # uncomment once Search Console access is added (README step 5)
    country: US                              # search market the blogs target; change to IN for Indian clients
    group: us-it-bpo
    builder: auto                            # site uses an Elegant Themes (Divi) theme — auto-detect will confirm
    publish_mode: draft                      # first 2 weeks: drafts only, then change to: schedule
    min_words: 1100
    default_category: Blogs                  # existing blog category on the site
    niche: >-
      B2B lead generation (healthcare/medical, education, financial, customised and digital-marketing leads)
      and IT/BPO outsourcing (data entry, e-support, international call center, data conversion)
    audience: >-
      Owners and marketing/operations heads of healthcare, education and finance businesses who want
      affordable, high-quality leads or want to outsource support and back-office work
    tone: Professional, clear and practical B2B — trustworthy and transparent, no hype
    seed_keywords: [healthcare lead generation, education lead generation, b2b lead generation services, data entry outsourcing, international call center services, financial lead generation]
    competitors: []                          # add 2–3 competitor domains for gap research
    writing_rules: |
      - Write for business buyers: explain costs, process, quality checks, compliance and what to ask a vendor.
      - Where relevant, link to these service pages: https://globelconnect.in/healthcare-lead-generation/ ,
        https://globelconnect.in/education-lead-generation/ , https://globelconnect.in/financial-lead-generation-2/ ,
        https://globelconnect.in/customized-lead-generation/ , https://globelconnect.in/data-entry-services/ ,
        https://globelconnect.in/international-call-center-services/ , https://globelconnect.in/e-support-services/ ,
        https://globelconnect.in/data-conversion-services/ , https://globelconnect.in/digital-marketing-services/
      - Never promise guaranteed lead numbers, conversion rates or ROI; no invented client results or testimonials.
      - For healthcare/finance leads, mention consent and data-privacy compliance (e.g. TCPA, HIPAA, GDPR where relevant)
        in general terms only — no legal advice.
    cta:
      title: Need better leads or extra support capacity?
      text: Tell us about your business and goals — the Globel Connect team will suggest the right lead generation or outsourcing plan.
      button: Talk to Our Team
      url: https://globelconnect.in/contact-us/
    enabled: true

  - key: kaizen-klub
    name: Kaizen Klub
    url: https://blogs.kaizenklub.in          # the WordPress blog (the main kaizenklub.in site is not WordPress)
    gsc_property: sc-domain:kaizenklub.in     # or "https://blogs.kaizenklub.in/" if you verified only the blog URL
    country: IN
    builder: auto
    publish_mode: draft                       # first 2 weeks: drafts only, you review & publish. Then change to: schedule
    min_words: 1100
    niche: >-
      Community gym in Koramangala, Bengaluru — strength & conditioning, MMA & striking, yoga & mobility,
      transformation programs, and recovery (cold plunge, sauna, red light therapy)
    audience: Bengaluru gym-goers, beginners and working professionals in Koramangala / HSR who want coached training and proper recovery
    tone: Coach-like, warm and practical — "Train. Recover. Belong." Small, relentless improvements.
    seed_keywords: [gym in koramangala, strength training for beginners, mma classes in bangalore, recovery gym bangalore, yoga classes in koramangala]
    competitors: [cult.fit]
    external_links_ok: [acefitness.org, acsm.org, powerlifting.sport, health.harvard.edu, hss.edu]
    writing_rules: |
      - Use the focus keyword about 10–12 times in 1,100–1,400 words (~1% density), including the first sentence,
        1–2 H2 headings and the conclusion — always natural, never forced.
      - Do NOT give free workout plans, home-workout routines, downloadable trackers or DIY templates.
        Instead, steer readers to train with a Kaizen Klub coach and to take the free assessment.
      - Mention Kaizen Klub naturally where it genuinely helps (coached small-group sessions, recovery facilities:
        cold plunge, sauna, red light therapy), never as a hard sell in every paragraph.
      - Only realistic timelines and claims (e.g. strength gains in 2–4 weeks, visible changes in 6–8+ weeks).
      - Use 1–2 trusted external sources only: Cleveland Clinic, Mayo Clinic, Harvard Health, NHS, CDC, WHO,
        NCCIH, ACE Fitness, ACSM, HSS — with real, existing URLs.
      - Where it fits, link to: https://kaizenklub.in/programs/strength , https://kaizenklub.in/programs/yoga ,
        https://kaizenklub.in/programs/mma
      - Indian context: Indian foods, ₹ prices, Bengaluru weather/traffic where relevant.
    cta:
      title: Not sure where to start?
      text: Book a free assessment with a Kaizen Klub coach — we'll check your strength, mobility and goals, then build your first month with you.
      button: Take Free Assessment
      url: https://forms.fillout.com/t/61JKRjYhkkus
    enabled: true
